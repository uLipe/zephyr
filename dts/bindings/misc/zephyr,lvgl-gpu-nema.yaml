description: |
  LVGL NemaGFX GPU binding

  Example configuration:

  lvgl_vglite {
          compatible = "zephyr,lvgl-gpu-nema";
          gpu = <&gpu2d>;
          variant = "NemaGFX";
          revision = "0";
  };

compatible: "zephyr,lvgl-gpu-nema"

include: zephyr,lvgl-gpu-common.yaml

properties:
  variant:
    type: string
    required: true
    description: GPU2D variant string.

  revision:
    type: string
    required: true
    description: GPU2D variant revision implementation.
